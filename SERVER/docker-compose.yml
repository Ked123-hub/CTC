services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_PASSWORD: NGOh3ster!
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ctc-server:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    # Do not bind-mount the host directory into the container. Use the image's
    # built-in files and dependencies to avoid host/container node_modules
    # mismatches on Windows.
    command: npm start

volumes:
  db_data: {}
  redis_data: {}